name: Web CI

# Checks for the web app only (web/). The backend has its own checks.
on:
  pull_request:
    paths: ["web/**", "tests/fixtures/**", "scoring/**", ".github/workflows/web-ci.yml"]
  push:
    branches: [main]
    paths: ["web/**", "tests/fixtures/**", "scoring/**", ".github/workflows/web-ci.yml"]

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: "Browser tests (iPhone WebKit, Android Chromium, 360 px, accessibility)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
